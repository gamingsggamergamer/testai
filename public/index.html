<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RDT-BOT - Roblox Development Tool Bot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login-screen" class="card">
    <h2>RDT-BOT Access</h2>
    <p>Roblox Development Tool Bot</p>
    <input type="text" id="username-input" placeholder="Enter Roblox Username">
    <button onclick="login()">Login</button>
  </div>

  <div id="app-screen" class="hidden">
    <header>
      <div class="logo">RDT-BOT</div>
      <div class="controls">
        <select id="model-select">
          <option value="fable-5.1">Claude Fable 5.1</option>
        </select>
        <span id="credit-tag">Credits: 100/100</span>
      </div>
    </header>

    <div id="chat-box"></div>

    <div id="input-area">
      <label for="image-upload" class="upload-btn">📷</label>
      <input type="file" id="image-upload" accept="image/*" onchange="handleImageSelect(event)">
      <input type="text" id="chat-input" placeholder="Message">
      <button onclick="sendMessage()">Send</button>
    </div>
    <div id="image-preview" class="hidden">
      <span id="preview-text">Image selected</span>
      <button onclick="clearImage()">X</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
